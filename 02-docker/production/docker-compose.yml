# ============================================================
# Docker Compose — Full Agent Stack
#
# Services:
#   1. agent    — FastAPI AI agent (2 replicas)
#   2. redis    — Cache cho session và rate limiting
#   3. qdrant   — Vector database cho RAG
#   4. nginx    — Reverse proxy, load balancer
#
# Chạy: docker compose up
# Test:  curl http://localhost/health
# Stop:  docker compose down
# ============================================================

services:

  # ──────────────────────────────────────
  # Agent Service
  # ──────────────────────────────────────
  agent:
    build:
      # context phải là gốc repo vì Dockerfile COPY theo đường dẫn
      # "02-docker/production/..." và "utils/mock_llm.py"
      context: ../..
      dockerfile: 02-docker/production/Dockerfile
      target: runtime          # chỉ build stage "runtime", không build "builder"
    environment:
      - ENVIRONMENT=staging
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      # qdrant tạm tắt (Docker Hub rate limit, không có mirror) — agent không dùng đến
      # - QDRANT_URL=http://qdrant:6333
      # ❌ KHÔNG đặt secrets trực tiếp ở đây trong production
      # ✅ Dùng: docker secret hoặc env file ngoài git
    env_file:
      - .env.local              # secrets riêng, trong .gitignore
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Không expose port trực tiếp — dùng qua Nginx
    networks:
      - internal

  # ──────────────────────────────────────
  # Redis — Session cache & Rate limiting
  # ──────────────────────────────────────
  redis:
    # mirror ECR Public — tránh Docker Hub rate limit
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # ──────────────────────────────────────
  # Qdrant — Vector database
  # TẠM TẮT: Docker Hub rate limit + agent bài này không dùng qdrant.
  # Bỏ comment khi cần demo RAG.
  # ──────────────────────────────────────
  # qdrant:
  #   image: qdrant/qdrant:v1.9.0
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   healthcheck:
  #     # image qdrant không có curl — dùng bash TCP check
  #     test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 3
  #   networks:
  #     - internal

  # ──────────────────────────────────────
  # Nginx — Reverse proxy & Load balancer
  # ──────────────────────────────────────
  nginx:
    # mirror ECR Public — tránh Docker Hub rate limit
    image: public.ecr.aws/docker/library/nginx:alpine
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS (cần cert)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
    restart: unless-stopped
    networks:
      - internal

# ──────────────────────────────────────
# Volumes — persistent data
# ──────────────────────────────────────
volumes:
  redis_data:
  # qdrant_data:  # tạm tắt cùng service qdrant

# ──────────────────────────────────────
# Network — isolate internal traffic
# ──────────────────────────────────────
networks:
  internal:
    driver: bridge
